name: Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo dnf install -y git
            rm -rf ~/ec2-webapp
            git clone https://github.com/${{ github.repository }}.git ~/ec2-webapp
            sudo cp ~/ec2-webapp/index.html /usr/share/nginx/html/index.htmlgit add .