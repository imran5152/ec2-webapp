name: Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
    steps:
      - name: Deploy to EC2
        run: |
          # 1. Key tayyar karo
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          # 2. EC2 mein login karke code laao aur site live karo
          ssh -i ~/.ssh/ec2.pem "ec2-user@$EC2_HOST" 'bash -se' <<'EOF'
          APP="/home/ec2-user/ec2-webapp"
          command -v git >/dev/null || sudo dnf install -y git
          if [ -d "$APP/.git" ]; then
            cd "$APP"
            git pull --ff-only origin main
          else
            git clone -b main "https://github.com/${{ github.repository }}.git" "$APP"
          fi
          sudo cp "$APP/index.html" /usr/share/nginx/html/index.html
          EOF